[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pilot-bim-bridge"
version = "0.2.1"
description = "Python client for Pilot BIM Bridge Custom API and durable bulk exports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2"]
streaming = ["ijson>=3.3"]
numpy = ["numpy>=1.24"]
test = ["pandas>=2", "ijson>=3.3"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
bim_bridge = ["_pilot_source/*.cs", "_pilot_source/*.csproj"]
