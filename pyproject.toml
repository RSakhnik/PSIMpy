[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pilot-bim-bridge"
version = "0.1.3"
description = "Python client for the BIM Workers Manager REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2"]
streaming = ["ijson>=3.3"]
test = ["pandas>=2", "ijson>=3.3"]

[tool.setuptools.packages.find]
where = ["src"]
